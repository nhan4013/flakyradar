<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}FlakyRadar{% endblock %}</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 2rem; color: #1a1a1a; background: #fafafa; }
  h1 { margin-bottom: 0.25rem; }
  .sub { color: #666; margin-bottom: 1.5rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
  tr:hover { background: #f5f5f5; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
  .badge-high { background: #fde2e2; color: #a12; }
  .badge-mid { background: #fff2cc; color: #a70; }
  .badge-low { background: #e2f4e2; color: #2a2; }
  .quarantined { opacity: 0.55; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; margin-right: 0.25rem; }
  .pass { background: #e2f4e2; color: #2a2; }
  .fail { background: #fde2e2; color: #a12; }
  .error { background: #fde2e2; color: #a12; }
  .skipped { background: #eee; color: #666; }
  form { display: inline; }
  button { cursor: pointer; }
</style>
</head>
<body>
<h1><a href="{% url 'index' %}">FlakyRadar</a></h1>
{% block content %}{% endblock %}
</body>
</html>
