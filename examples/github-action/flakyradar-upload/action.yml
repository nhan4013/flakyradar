name: "FlakyRadar Upload"
description: "Upload pytest JUnit XML results to a self-hosted FlakyRadar instance"
inputs:
  server-url:
    description: "Base URL of your FlakyRadar ingest API"
    required: true
  api-key:
    description: "Project API key (store as a repo secret)"
    required: true
  report-path:
    description: "Path to the test report"
    required: true
    default: "junit.xml"
  report-format:
    description: "junit (pytest/JUnit Java), jest-json, or go-test-json"
    required: false
    default: "junit"
runs:
  using: "composite"
  steps:
    - name: Upload report to FlakyRadar
      shell: bash
      run: |
        curl -sf -X POST \
          "${{ inputs.server-url }}/v1/reports?commit_sha=${{ github.sha }}&branch=${{ github.ref_name }}&ci_run_id=${{ github.run_id }}&report_format=${{ inputs.report-format }}" \
          -H "X-API-Key: ${{ inputs.api-key }}" \
          -F "file=@${{ inputs.report-path }}"
