services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flakyradar}
      POSTGRES_USER: ${POSTGRES_USER:-flakyradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flakyradar}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flakyradar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    working_dir: /app/apps/dashboard
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build: .
    command: uvicorn ingest.main:app --host 0.0.0.0 --port 8001
    working_dir: /app/apps
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info
    working_dir: /app/apps
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 3 diagnostic agent. Opt-in only (docker compose --profile agent up) —
  # this service mounts the host docker socket to run the sandbox, which is a much
  # stronger trust boundary than the ingest worker. Never enable this on a host you
  # don't control; see README "Diagnostic agent" section.
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    profiles: ["agent"]
    command: celery -A worker.celery_app worker --loglevel=info -Q diagnose
    working_dir: /app/apps
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
